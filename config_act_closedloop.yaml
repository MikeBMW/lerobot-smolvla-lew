# Z-MAX 数据闭环 · ACT 最小训练配置 (静静4060)
# 用法: uv run python -m lerobot.scripts.lerobot_train --config-path config_act_closedloop.yaml
dataset_repo_id: lerobot/pusht
policy:
  type: act
  n_obs_steps: 2
  n_action_steps: 7
  chunk_size: 7
  dim_model: 256
  dim_feedforward: 1024
  n_heads: 8
  n_encoder_layers: 4
  n_decoder_layers: 4
  num_inference_timesteps: 1

training:
  output_dir: outputs/train/act_closed_loop
  num_epochs: 10
  batch_size: 8
  learning_rate: 1e-4
  offline: true
  device: cuda
  seed: 1337
