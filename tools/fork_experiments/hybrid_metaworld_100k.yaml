# ZmaxHybrid MetaWorld 100K — resume from 20K checkpoint
output_dir: outputs/zmax_hybrid_mw_100k
job_name: zmax_hybrid_mw_100k
resume: true

policy:
  type: zmax_hybrid
  push_to_hub: false
  freeze_smolvlm: true
  chunk_size: 7
  n_action_steps: 7
  gradient_checkpointing: true
  torch_dtype: float16
  device: cuda
  state_dim: 4
  action_dim: 4

dataset:
  repo_id: lerobot/metaworld_mt50_push_v2_image

batch_size: 32
steps: 100000
num_workers: 2
save_freq: 5000
eval_freq: 20000

optimizer:
  type: adamw
  lr: 0.0001
  weight_decay: 1e-10
  grad_clip_norm: 10.0
  betas: [0.9, 0.95]
  eps: 1e-08

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1000
  num_decay_steps: 30000
  peak_lr: 0.0001
  decay_lr: 2.5e-06
