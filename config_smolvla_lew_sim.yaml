dataset:
  repo_id: data/smolvla_peg_v8_d1
  root: data/smolvla_peg_v8_d1
  episodes: null
  image_transforms:
    enable: false
    max_num_transforms: 3
    random_order: false
    tfs:
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness:
          - 0.8
          - 1.2
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast:
          - 0.8
          - 1.2
      saturation:
        weight: 1.0
        type: ColorJitter
        kwargs:
          saturation:
          - 0.5
          - 1.5
      hue:
        weight: 1.0
        type: ColorJitter
        kwargs:
          hue:
          - -0.05
          - 0.05
      sharpness:
        weight: 1.0
        type: SharpnessJitter
        kwargs:
          sharpness:
          - 0.5
          - 1.5
      affine:
        weight: 1.0
        type: RandomAffine
        kwargs:
          degrees:
          - -5.0
          - 5.0
          translate:
          - 0.05
          - 0.05
