# Z-MAX ACT 闭环快速训练 · 小芳实时数据
# 数据: data/orin_6d (真机 6D state/action + 图像) — build_orin6d_dataset.py 构建
output_dir: outputs/train/act_loop
job_name: act_loop

policy:
  type: act
  push_to_hub: false
  repo_id: MikeBMW/zmax-act-loop
  n_obs_steps: 1
  n_action_steps: 7
  chunk_size: 7
  dim_model: 256
  dim_feedforward: 1024
  n_heads: 8
  n_encoder_layers: 4
  n_decoder_layers: 4
  use_vae: true
  latent_dim: 32

dataset:
  repo_id: lerobot/pusht
  root: data/orin_6d
  episodes: null
  use_imagenet_stats: false

batch_size: 8
steps: 2000
num_workers: 0
persistent_workers: false
log_freq: 200
eval_freq: 1000
save_freq: 1000
save_checkpoint: true
seed: 1337

optimizer:
  type: adam
  lr: 1e-4
  weight_decay: 0.0

wandb:
  enable: false
