# Z-MAX ACT 公平对比基线 (metaworld_mt50 4D+真图 · 300步)
output_dir: outputs/train/act_mt50_base
job_name: act_mt50_base

policy:
  type: act
  push_to_hub: false
  repo_id: MikeBMW/zmax-act-mt50-base
  n_obs_steps: 1
  n_action_steps: 7
  chunk_size: 7
  dim_model: 256
  dim_feedforward: 1024
  n_heads: 8
  n_encoder_layers: 4
  n_decoder_layers: 4
  use_vae: true
  latent_dim: 32

dataset:
  repo_id: lerobot/pusht
  root: data/metaworld_mt50
  episodes: [0]
  use_imagenet_stats: true

batch_size: 8
steps: 300
num_workers: 0
persistent_workers: false
log_freq: 100
eval_freq: 300
save_freq: 300
save_checkpoint: true
seed: 1337

optimizer:
  type: adam
  lr: 1e-4
  weight_decay: 0.0

wandb:
  enable: false
