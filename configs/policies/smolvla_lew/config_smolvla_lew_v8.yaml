# Z-MAX · SmolVLA + LeWorldModel 微调 (v8 图像数据集 · 2026-09-08 扩数据后)
# VLM(SmolVLM2-500M) 冻结作编码器; 训练 DiT ActionHead + LEW 世界模型
# 数据: 124 episodes × metaworld 真实渲染帧 (多 seed 布局)
output_dir: outputs/train/smolvla_lew_v8
job_name: smolvla_lew_v8

policy:
  type: smolvla_lew
  push_to_hub: false
  smolvlm_name: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  freeze_smolvlm: true           # VLM 冻结 (编码器); 训 ActionHead/LEW
  action_model_type: DiT-B
  action_hidden_size: 256
  action_num_layers: 1
  num_inference_timesteps: 2
  chunk_size: 7
  n_action_steps: 7
  n_obs_steps: 1
  siglip_image_size: 64
  num_vision_tokens: 64
  enable_lew_world_model: true
  lew_loss_weight: 0.1
  lew_hidden_dim: 192
  lew_num_layers: 6
  lew_attention_heads: 8
  lew_dim_head: 24
  lew_mlp_dim: 768
  lew_dropout: 0.1
  num_video_frames: 2

dataset:
  repo_id: data/smolvla_peg_v8   # 本地数据集路径 (repo_id=路径 → 不查 HF)
  root: data/smolvla_peg_v8
  episodes: null          # 全量 124
  use_imagenet_stats: true

batch_size: 1
steps: 10000
num_workers: 2
persistent_workers: false
log_freq: 20
eval_freq: -1
save_freq: 1000
save_checkpoint: true
seed: 1337

optimizer:
  type: adam
  lr: 1e-4
  weight_decay: 0.0

wandb:
  enable: false
resume: true
