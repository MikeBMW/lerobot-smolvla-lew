# Z-MAX · SmolVLA + LeWorldModel 训练配置 (metaworld 统一数据集 · 三模型对比用)
# 用法: .venv/bin/python -m lerobot.scripts.lerobot_train --config_path <此文件>
# ⚠️ 关键: enable_lew_world_model:true + freeze_smolvlm:true 可共存 (2026-08-05 老倪修正:
#   configuration_smolvla_lew.py __post_init__ 原强制关 LEW 已移除; LeWorldModel.encode_frame
#   用 no_grad 冻结 SigLIP 提特征, predictor/action_encoder 独立训练; VLM 冻结省显存+加速)
output_dir: outputs/train/smolvla_lew_20260807_154617
job_name: smolvla_lew_20260807_154617

policy:
  type: smolvla_lew
  push_to_hub: false
  smolvlm_name: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  freeze_smolvlm: true           # VLM 冻结不训练 (老倪 2026-08-05: SmolVLM2 参数冻结; LEW 独立训练不受影响)
  action_model_type: DiT-B
  action_hidden_size: 256
  action_num_layers: 1
  num_inference_timesteps: 2
  chunk_size: 7
  n_action_steps: 7
  n_obs_steps: 1
  siglip_image_size: 64
  num_vision_tokens: 64
  # Sys-12: LeWorldModel 世界模型 (串行在 DiT 之后 — 官方 forward: embeds→DiT 动作→LEW 世界预测)
  enable_lew_world_model: true
  lew_loss_weight: 0.1
  lew_hidden_dim: 192
  lew_num_layers: 6
  lew_attention_heads: 8
  lew_dim_head: 24
  lew_mlp_dim: 768
  lew_dropout: 0.1
  num_video_frames: 2

dataset:
  repo_id: lerobot/pusht   # 占位 (实际用 root 本地数据)
  root: data/metaworld_act
  episodes: [0]

batch_size: 1
steps: 1000
num_workers: 0
persistent_workers: false
log_freq: 5
eval_freq: 150
save_freq: 150
save_checkpoint: true
seed: 1337

optimizer:
  type: adam
  lr: 1e-4
  weight_decay: 0.0

wandb:
  enable: false
