# Smoke: SmolVLA+LEW 训练冒烟 (metaworld_peg 图像数据集 · 4060)
output_dir: /tmp/smolvla_smoke
job_name: smolvla_lew_smoke

policy:
  type: smolvla_lew
  push_to_hub: false
  smolvlm_name: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  freeze_smolvlm: true
  action_model_type: DiT-B
  action_hidden_size: 256
  action_num_layers: 1
  num_inference_timesteps: 2
  chunk_size: 7
  n_action_steps: 7
  n_obs_steps: 1
  siglip_image_size: 64
  num_vision_tokens: 64
  enable_lew_world_model: true
  lew_loss_weight: 0.1
  lew_hidden_dim: 192
  lew_num_layers: 6
  lew_attention_heads: 8
  lew_dim_head: 24
  lew_mlp_dim: 768
  lew_dropout: 0.1
  num_video_frames: 2

dataset:
  repo_id: local/metaworld_peg
  root: data/metaworld_peg
  episodes: [0, 1, 2, 3, 4]

batch_size: 1
steps: 8
num_workers: 0
persistent_workers: false
log_freq: 2
eval_freq: 0
save_freq: 0
save_checkpoint: false
seed: 1337

optimizer:
  type: adam
  lr: 1e-4
  weight_decay: 0.0

wandb:
  enable: false
