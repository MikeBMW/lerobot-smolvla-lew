name: Build Desktop (Windows .exe + macOS .app)

# 2026-08-25 老倪: 大版本发布要同时出 Windows 和 Mac 版 → 一次 tag 推送并行构建两个平台,
# 各自把产物挂到同一个 Release 上 (svenstaro/upload-release-action, overwrite=true)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v3.0.0)'
        required: false
        default: 'dev-snapshot'

jobs:
  # ────────────────────────── Windows ──────────────────────────
  build:
    name: Windows .exe
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt5 numpy pillow grpcio protobuf python-pptx pyqtgraph PyOpenGL
          # 🐛 09-10: Windows 真实化运行同样需要 metaworld (老倪: Windows 版要测)
          pip install mujoco metaworld glfw gymnasium imageio
          python -c "import metaworld, mujoco; print('metaworld/mujoco OK:', hasattr(metaworld, 'ML1'), mujoco.__version__)"

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate version info (exe 文件属性带真实版本, 不再 0.0.0)
        shell: bash
        run: |
          VER="${{ steps.release_tag.outputs.tag }}"; VER="${VER#v}"
          python -c "
          import sys
          ver = '$VER'.split('.')
          ver = (ver + ['0','0','0'])[:4]
          tpl = '''VSVersionInfo(
            ffi=FixedFileInfo(filevers=(%s,%s,%s,%s), prodvers=(%s,%s,%s,%s), mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[StringFileInfo([StringTable('040904B0', [
              StringStruct('CompanyName', 'ZFCY Z-MAX'),
              StringStruct('FileDescription', 'Z-MAX Console'),
              StringStruct('FileVersion', '$VER'),
              StringStruct('InternalName', 'Z-MAX_Console'),
              StringStruct('OriginalFilename', 'Z-MAX_Console.exe'),
              StringStruct('ProductName', 'Z-MAX Console'),
              StringStruct('ProductVersion', '$VER')])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])]
          )'''
          print(tpl % (ver[0],ver[1],ver[2],ver[3],ver[0],ver[1],ver[2],ver[3]))
          " > tools/gui/version_info.txt

      - name: Download MLP operation video + pre-extracted frames (exe 内置操作视频; Windows 无 ffmpeg → 用预抽帧缓存直接播放, 2026-08-27)
        shell: bash
        run: |
          mkdir -p reports
          curl -fsSL -o mlp_video_pack.zip https://datadrive.world/models/mlp_video_pack.zip
          python -m zipfile -e mlp_video_pack.zip reports/
          ls -la reports/ | head -8
          ls reports/_mlp_cache_mlp_insert_success_final/ | wc -l

      - name: "Download manifold predictor weights (流形预测通道/流形 yaw 执行要真权重 — 权重不进代码库, 走 ECS 静态)"
        shell: bash
        run: |
          mkdir -p models
          curl -fsSL -o models/l4_mani_predictor_v5.pt https://datadrive.world/models/l4_mani_predictor_v5.pt
          python -c "import hashlib; h=hashlib.md5(open('models/l4_mani_predictor_v5.pt','rb').read()).hexdigest(); print('weights md5:', h); assert h=='4acf227db32b7af6e7f9d3d1f6cf3245', h"

      - name: "Generate L4 demo scene XML (L4 干扰机构 来料转台/光耦合台 注入 metaworld 资产, 随 --collect-all 进 exe)"
        shell: bash
        run: |
          python tools/gen_l4_demo_scene.py --peg-real-inertia
          python -c "import metaworld,os; p=os.path.join(os.path.dirname(metaworld.__file__),'assets','sawyer_xyz','sawyer_peg_insertion_side_l4.xml'); print('L4 XML:', p, os.path.isfile(p)); assert os.path.isfile(p)"

      - name: Build .exe with PyInstaller
        run: |
          cd tools\gui
          python -c "from PIL import Image; Image.open('logo.png').save('logo.ico')"
          pyinstaller --onefile --windowed --icon logo.ico --name "Z-MAX_Console" --version-file version_info.txt --add-data "logo.png;." --add-data "$env:GITHUB_WORKSPACE\tools\gen_l4_demo_video.py;." --add-data "docs_sync.py;." --add-data "ppt_engine.py;." --add-data "update_checker.py;." --add-data "$env:GITHUB_WORKSPACE\flows;flows" --add-data "$env:GITHUB_WORKSPACE\src\lerobot\policies\left_right;src\lerobot\policies\left_right" --add-data "$env:GITHUB_WORKSPACE\src\lerobot\policies\yolo_3d;src\lerobot\policies\yolo_3d" --add-data "$env:GITHUB_WORKSPACE\src\lerobot\calibration;src\lerobot\calibration" --add-data "$env:GITHUB_WORKSPACE\src\lerobot\manifold;src\lerobot\manifold" --add-data "$env:GITHUB_WORKSPACE\src\lerobot\verification;src\lerobot\verification" --add-data "$env:GITHUB_WORKSPACE\src\lerobot\memory;src\lerobot\memory" --add-data "$env:GITHUB_WORKSPACE\reports\mlp_insert_success_final.mp4;reports" --add-data "$env:GITHUB_WORKSPACE\reports\_mlp_cache_mlp_insert_success_final;reports\_mlp_cache_mlp_insert_success_final" --add-data "$env:GITHUB_WORKSPACE\models\l4_mani_predictor_v5.pt;models" --hidden-import metaworld --hidden-import mujoco --collect-all metaworld --collect-all mujoco --collect-all pyqtgraph --collect-all OpenGL --collect-all glfw --collect-all gymnasium --collect-all imageio studio.py

      - name: "Verify engine assets bundled (metaworld XML + L4 场景 XML 必须在 exe 内)"
        shell: bash
        run: |
          python -m PyInstaller.utils.cliutils.archive_viewer -r -b tools/gui/dist/Z-MAX_Console.exe > listing.txt 2>&1 || true
          NM=$(grep -c "metaworld" listing.txt || true)
          NC=$(grep -c "sawyer_peg_insertion_side.xml" listing.txt || true)
          N4=$(grep -c "sawyer_peg_insertion_side_l4.xml" listing.txt || true)
          NG=$(grep -c "gen_l4_demo_video.py" listing.txt || true)
          NW=$(grep -c "l4_mani_predictor_v5.pt" listing.txt || true)
          echo "exe 内 metaworld 资产条目: $NM · stock peg XML: $NC · L4 场景 XML: $N4 · L4 生成器脚本: $NG · 流形预测权重: $NW"
          grep -m3 "sawyer_peg_insertion_side" listing.txt || true
          if [ "$NC" -lt 1 ] || [ "$N4" -lt 1 ] || [ "$NG" -lt 1 ] || [ "$NW" -lt 1 ]; then
            echo "::error::metaworld assets 未打进 exe (--collect-all metaworld 或 L4 场景 XML 预生成缺失)"
            exit 1
          fi
          ls -la tools/gui/dist/Z-MAX_Console.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z-MAX_Console-windows
          path: tools\gui\dist\Z-MAX_Console.exe
          compression-level: 0

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: tools\gui\dist\Z-MAX_Console.exe
          asset_name: Z-MAX_Console.exe
          tag: ${{ steps.release_tag.outputs.tag }}
          overwrite: true
          body: |
            ## Z-MAX Console ${{ steps.release_tag.outputs.tag }}

            桌面版下载 (双平台):
            - **Windows**: `Z-MAX_Console.exe` — 单文件免安装, 双击即用
            - **macOS**: `Z-MAX_Console-macOS.zip` — 解压得到 `Z-MAX_Console.app`
              (未签名 → 首次打开: 右键 → 打开, 或 系统设置 → 隐私与安全性 → 仍要打开)

            > macOS 版为 Apple Silicon (arm64) 构建; Intel Mac 请用 Windows 版或源码运行。

  # ────────────────────────── macOS ──────────────────────────
  build-mac:
    name: macOS .app
    runs-on: macos-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "PyQt5==5.15.11" numpy pillow grpcio protobuf python-pptx pyqtgraph PyOpenGL
          # 🐛 09-10 老倪: mac 真实化运行 No module named 'metaworld' → 补引擎依赖
          pip install mujoco metaworld glfw gymnasium imageio
          python -c "import metaworld, mujoco; print('metaworld/mujoco OK:', hasattr(metaworld, 'ML1'), mujoco.__version__)"

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Make .icns icon (PyInstaller 在 mac 只认 .icns)
        run: |
          cd tools/gui
          mkdir -p logo.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s logo.png --out logo.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2))
            sips -z $d $d logo.png --out logo.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns logo.iconset -o logo.icns
          ls -la logo.icns

      - name: Download MLP operation video + pre-extracted frames (exe 内置操作视频, 2026-08-27)
        shell: bash
        run: |
          mkdir -p reports
          curl -fsSL -o mlp_video_pack.zip https://datadrive.world/models/mlp_video_pack.zip
          python -m zipfile -e mlp_video_pack.zip reports/
          ls -la reports/ | head -8

      - name: Resolve metaworld assets path
        run: |
          echo "MW_ASSETS=$(python -c "import metaworld,os;print(os.path.join(os.path.dirname(metaworld.__file__),'assets'))")" >> $GITHUB_ENV

      - name: "Generate L4 demo scene XML (L4 干扰机构 来料转台/光耦合台 注入 metaworld 资产, 随 --collect-all 进 app)"
        run: |
          python tools/gen_l4_demo_scene.py --peg-real-inertia
          python -c "import metaworld,os; p=os.path.join(os.path.dirname(metaworld.__file__),'assets','sawyer_xyz','sawyer_peg_insertion_side_l4.xml'); print('L4 XML:', p, os.path.isfile(p)); assert os.path.isfile(p)"

      - name: "Download manifold predictor weights (流形预测通道/流形 yaw 执行要真权重 — 权重不进代码库, 走 ECS 静态)"
        run: |
          mkdir -p models
          curl -fsSL -o models/l4_mani_predictor_v5.pt https://datadrive.world/models/l4_mani_predictor_v5.pt
          python -c "import hashlib; h=hashlib.md5(open('models/l4_mani_predictor_v5.pt','rb').read()).hexdigest(); print('weights md5:', h); assert h=='4acf227db32b7af6e7f9d3d1f6cf3245', h"
      - name: Build .app with PyInstaller
        run: |
          cd tools/gui
          pyinstaller --windowed --icon logo.icns --name "Z-MAX_Console" \
            --add-data "logo.png:." \
            --add-data "$GITHUB_WORKSPACE/tools/gen_l4_demo_video.py:." --add-data "docs_sync.py:." \
            --add-data "ppt_engine.py:." --add-data "update_checker.py:." \
            --add-data "$GITHUB_WORKSPACE/flows:flows" \
            --add-data "$GITHUB_WORKSPACE/src/lerobot/policies/left_right:src/lerobot/policies/left_right" \
            --add-data "$GITHUB_WORKSPACE/src/lerobot/policies/yolo_3d:src/lerobot/policies/yolo_3d" \
            --add-data "$GITHUB_WORKSPACE/src/lerobot/calibration:src/lerobot/calibration" \
            --add-data "$GITHUB_WORKSPACE/src/lerobot/manifold:src/lerobot/manifold" \
            --add-data "$GITHUB_WORKSPACE/src/lerobot/verification:src/lerobot/verification" \
            --add-data "$GITHUB_WORKSPACE/src/lerobot/memory:src/lerobot/memory" \
            --add-data "$GITHUB_WORKSPACE/reports/mlp_insert_success_final.mp4:reports" \
            --add-data "$GITHUB_WORKSPACE/reports/_mlp_cache_mlp_insert_success_final:reports/_mlp_cache_mlp_insert_success_final" \
            --add-data "$GITHUB_WORKSPACE/models/l4_mani_predictor_v5.pt:models" \
            --hidden-import metaworld --hidden-import mujoco --collect-all metaworld --collect-all mujoco \
            --collect-all pyqtgraph --collect-all OpenGL \
            --add-data "$MW_ASSETS:metaworld/assets" \
            --collect-all glfw --collect-all gymnasium --collect-all imageio \
            studio.py
          ls -la dist/

      - name: "Verify engine assets bundled (metaworld XML + L4 场景 XML 必须在 .app 内)"
        run: |
          N=$(find tools/gui/dist/Z-MAX_Console.app -name "sawyer_peg_insertion_side.xml" | wc -l)
          N4=$(find tools/gui/dist/Z-MAX_Console.app -name "sawyer_peg_insertion_side_l4.xml" | wc -l)
          NG=$(find tools/gui/dist/Z-MAX_Console.app -name "gen_l4_demo_video.py" | wc -l)
          NW=$(find tools/gui/dist/Z-MAX_Console.app -name "l4_mani_predictor_v5.pt" | wc -l)
          echo "app 内 metaworld stock XML: $N · L4 场景 XML: $N4 · L4 生成器脚本: $NG · 流形预测权重: $NW"
          if [ "$N" -lt 1 ] || [ "$N4" -lt 1 ] || [ "$NG" -lt 1 ] || [ "$NW" -lt 1 ]; then
            echo "::error::metaworld assets 未打进 .app (--collect-all metaworld 或 L4 场景 XML 预生成缺失)"
            exit 1
          fi

      - name: Set bundle version (修 PyInstaller 默认 0.0.0 → 真实版本)
        run: |
          cd tools/gui
          VER="${{ steps.release_tag.outputs.tag }}"; VER="${VER#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" dist/Z-MAX_Console.app/Contents/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VER" dist/Z-MAX_Console.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VER" dist/Z-MAX_Console.app/Contents/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VER" dist/Z-MAX_Console.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.zfcg.zmax.console" dist/Z-MAX_Console.app/Contents/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.zfcg.zmax.console" dist/Z-MAX_Console.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/Z-MAX_Console.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" dist/Z-MAX_Console.app/Contents/Info.plist

      - name: Zip .app (ditto 保留资源分叉/权限, 直接 zip 会丢可执行位)
        run: |
          cd tools/gui/dist
          ditto -c -k --sequesterRsrc --keepParent "Z-MAX_Console.app" "Z-MAX_Console-macOS.zip"
          ls -la Z-MAX_Console-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z-MAX_Console-macos
          path: tools/gui/dist/Z-MAX_Console-macOS.zip
          compression-level: 0

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: tools/gui/dist/Z-MAX_Console-macOS.zip
          asset_name: Z-MAX_Console-macOS.zip
          tag: ${{ steps.release_tag.outputs.tag }}
          overwrite: true
