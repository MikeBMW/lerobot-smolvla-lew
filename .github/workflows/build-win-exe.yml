name: Build Windows .exe (Z-MAX Console)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.6)'
        required: false
        default: 'dev-snapshot'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt5 numpy pillow grpcio protobuf

      - name: Build .exe with PyInstaller
        run: |
          cd tools\gui
          python -c "from PIL import Image; Image.open('logo.png').save('logo.ico')"
          pyinstaller --onefile --windowed --icon logo.ico --name "Z-MAX_Console" --add-data "logo.png;." studio.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z-MAX_Console
          path: tools\gui\dist\Z-MAX_Console.exe
          compression-level: 0

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: tools\gui\dist\Z-MAX_Console.exe
          asset_name: Z-MAX_Console.exe
          tag: ${{ steps.release_tag.outputs.tag }}
          overwrite: true
