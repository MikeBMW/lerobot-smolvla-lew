name: Build & Push Z-MAX Console Docker Image

"on":
  push:
    tags:
      - 'v*'           # v1.0.5, v1.1.0, etc.
    paths:
      - 'tools/gui/Dockerfile'
      - 'tools/gui/**/*.py'
      - 'tools/gui/**/*.sh'
  workflow_dispatch:

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: zmax
  IMAGE: console

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Generate tags
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          echo "tags=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE }}:${TAG#v}" >> $GITHUB_OUTPUT
          echo "tags=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE }}:latest" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tools/gui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image reference
        run: echo "✅ Pushed → ${{ steps.meta.outputs.tags }}"
