<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏭 场景可视化 · Z-MAX</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:24px 14px}
h1{color:#00d4aa;font-size:22px;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#8b949e;font-size:12px;margin-bottom:18px}
.scene-nav{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.scene-tab{padding:8px 16px;border-radius:8px;border:1px solid #1a1f2b;cursor:pointer;font-size:12px;font-weight:600;color:#8b949e;background:#0d1117;transition:all .15s}
.scene-tab:hover{border-color:#00d4aa;color:#00d4aa}
.scene-tab.active{background:#00d4aa18;border-color:#00d4aa;color:#00d4aa}
.card{background:#0d1117;border:1px solid #1a1f2b;border-radius:10px;padding:14px;margin-bottom:12px}
.card-h{font-size:14px;font-weight:700;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #1a1f2b44}
.card-h.c{color:#a371f7;border-color:#a371f733}
.card-h.g{color:#00d4aa;border-color:#00d4aa33}
.card-h.b{color:#58a6ff;border-color:#58a6ff33}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#1a1f2b;padding:6px 8px;text-align:left;color:#8b949e;font-weight:600}
td{padding:5px 8px;border-bottom:1px solid #1a1f2b44;color:#c9d1d9}
.kpi-row{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
.kpi{flex:1;min-width:140px;background:#0d1117;border:1px solid #1a1f2b;border-radius:8px;padding:10px}
.kpi .v{font-size:16px;font-weight:800;color:#00d4aa}
.kpi .l{font-size:10px;color:#8b949e;margin-top:2px}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #1a1f2b33}
.step-num{width:26px;height:26px;border-radius:50%;background:#00d4aa18;border:1px solid #00d4aa;color:#00d4aa;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.step-body{flex:1}
.step-name{font-weight:600;font-size:13px;color:#e6edf3}
.step-desc{font-size:11px;color:#8b949e;margin-top:2px}
.step-atoms{font-size:11px;color:#58a6ff;margin-top:3px}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;background:#1a1f2b;border:1px solid #1a1f2b;font-size:10px;color:#8b949e;margin-right:4px}
.tag-ok{color:#3fb950;border-color:#3fb95033}
.back{display:inline-block;margin-bottom:12px;color:#8b949e;font-size:12px;text-decoration:none}
.back:hover{color:#00d4aa}
footer{text-align:center;color:#484f58;font-size:11px;margin-top:24px;padding:12px}
.err{text-align:center;color:#ff4444;font-size:14px;padding:40px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 看板</a>
  <h1>🏭 光模块工厂 · 场景可视化</h1>
  <p class="sub" id="meta">Z-MAX 具身智能 · 场景节点 → 可视化 (数据来自 Simulink 场景 node JSON)</p>
  <div class="scene-nav" id="nav"></div>
  <div id="content"><div class="err">加载中…</div></div>
  <footer>© 2026 智蜂创元 · datadrive.world · 场景数据由控制台场景 node 传入</footer>
</div>
<script>
let SCENES = [];
const $ = s => document.querySelector(s);

function b64u(b){ // base64url → utf8
  try{return decodeURIComponent(atob(b).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));}
  catch(e){try{return atob(b);}catch(e2){return '';}}
}

function renderScene(s){
  const perf = s.performance||{};
  const lay = s.layout||{};
  const dims = lay.dimensions||{};
  const steps = s.process_steps||s.process||[];
  const gates = s.quality_gates||[];
  let kpis = Object.entries(perf).slice(0,6).map(([k,v])=>{
    const labels={operation_success_rate:'操作成功率',cycle_time:'节拍时间',insertion_force:'插拔力',positioning_accuracy:'定位精度',yield:'良率',defect_detection_rate:'检出率',false_call_rate:'误判率',throughput:'产能',pick_accuracy:'抓取精度',damage_rate:'损伤率',mtbf:'MTBF',repetitive_precision:'重复精度'};
    return `<div class="kpi"><div class="v">${v}</div><div class="l">${labels[k]||k}</div></div>`;
  }).join('');
  let dimHtml = Object.entries(dims).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  let stepHtml = steps.map((st,i)=>`
    <div class="step">
      <div class="step-num">${st.step||i+1}</div>
      <div class="step-body">
        <div class="step-name">${st.name}</div>
        <div class="step-desc">${st.desc||''}</div>
        <div class="step-atoms">${(st.atoms||[]).map(a=>`<span class="tag">${a}</span>`).join('')}</div>
      </div>
    </div>`).join('');
  return `
    <div class="card">
      <div class="card-h c">📋 ${s.name} <span style="font-size:11px;color:#8b949e;font-weight:400">(${s.id} · ${s.category} · ${s.scene_type||''})</span></div>
      <div style="font-size:12px;color:#8b949e;line-height:1.6">${s.description||''}</div>
    </div>
    <div class="card">
      <div class="card-h g">📊 工艺性能指标</div>
      <div class="kpi-row">${kpis}</div>
      <table><tr><th>质量门</th><th>指标</th></tr>
      ${gates.map(g=>`<tr><td>🛡</td><td><span class="tag tag-ok">${g}</span></td></tr>`).join('')||'<tr><td colspan="2">—</td></tr>'}
      </table>
    </div>
    <div class="card">
      <div class="card-h b">📐 布局与结构尺寸</div>
      <table>
        <tr><th>工位</th><td>${lay.workcell||'—'}</td></tr>
        <tr><th>机器人</th><td>${lay.robot||'—'}</td></tr>
        <tr><th>治具</th><td>${lay.fixture||''}${lay.camera?' · '+lay.camera:''}</td></tr>
        <tr><th>传感器</th><td>${(lay.sensors||[]).join('、')}</td></tr>
        ${dimHtml}
      </table>
    </div>
    <div class="card">
      <div class="card-h c">🔗 工序流程 (${steps.length} 步 · 原子技能组合)</div>
      ${stepHtml}
    </div>`;
}

function load(){
  const p = new URLSearchParams(location.search);
  const sceneId = p.get('scene');
  const jsonB64 = p.get('json');
  if(jsonB64){
    try{ SCENES = [JSON.parse(b64u(jsonB64))]; }catch(e){}
  }
  if(!SCENES.length){
    fetch('/api/scenes.json').then(r=>r.json()).then(d=>{SCENES=d.scenes||[];show();}).catch(()=>{$('#content').innerHTML='<div class="err">场景数据未传入 (需要 ?scene=SCN-01&json=... 或 /api/scenes.json)</div>';});
    return;
  }
  show();
}
function show(){
  const nav = $('#nav');
  nav.innerHTML = SCENES.map(s=>`<div class="scene-tab${s.id===SCENES[0].id?' active':''}" onclick="pick('${s.id}')">${s.id} ${s.name}</div>`).join('');
  pick(SCENES[0].id);
}
function pick(id){
  const s = SCENES.find(x=>x.id===id);
  if(!s) return;
  document.querySelectorAll('.scene-tab').forEach(t=>t.classList.toggle('active', t.textContent.startsWith(id)));
  $('#content').innerHTML = renderScene(s);
}
load();
</script>
</body>
</html>
